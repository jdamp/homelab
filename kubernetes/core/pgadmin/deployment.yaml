apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: pgadmin
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      securityContext:
        # The pgAdmin image runs as UID/GID 5050.  Ensure the mounted PVC is
        # writable by that group so pgAdmin can create its storage directory.
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.17
          ports:
            - containerPort: 80
              name: http
          env:
            # Keep transient sessions off the existing persistent data volume.
            - name: PGADMIN_CONFIG_SESSION_DB_PATH
              value: "'/tmp/pgadmin-sessions'"
            # Authentik OIDC with the existing local administrator retained as
            # a break-glass login during rollout.
            - name: PGADMIN_CONFIG_AUTHENTICATION_SOURCES
              value: "['oauth2', 'internal']"
            - name: PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER
              value: "True"
            - name: PGADMIN_CONFIG_OAUTH2_CONFIG
              valueFrom:
                secretKeyRef:
                  name: pgadmin-oidc
                  key: oauth2-config
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secrets
                  key: email
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secrets
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgadmin-data-pvc
