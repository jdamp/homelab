## This chart relies on the common library chart from bjw-s
## You can find it at https://github.com/bjw-s-labs/helm-charts/tree/common-5.0.1/charts/library/common
## Refer there for more detail about the supported values

controllers:
  main:
    containers:
      main:
        image:
          # Immich app version is pinned here because the Helm chart version can lag behind app releases.
          tag: v2.7.5

immich:
  metrics:
    # Enabling this will create the service monitors needed to monitor immich with the prometheus operator
    enabled: false
  persistence:
    library:
      existingClaim: immich-library
  # configuration is immich-config.json converted to yaml
  # ref: https://immich.app/docs/install/config-file/
  # Keep OAuth client secrets out of Git. Use an existing SealedSecret-backed Secret instead.
  configurationKind: Secret
  existingConfiguration: immich-config
  configuration: {}

# Dependencies

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

# Immich components

server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          # Bulk imports fan out thumbnail and transcoding jobs. Keep those jobs inside
          # a cgroup boundary so they cannot exhaust memory on the Kubernetes node.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 6Gi
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: username
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: dbname
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        # For large file uploads:
        traefik.ingress.kubernetes.io/buffering.maxRequestBodyBytes: "0"
      hosts:
        - host: fotos.mauzlab.de
          paths:
            - path: "/"
              service:
                identifier: main
      tls: [] # Uses Traefik's default

machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-machine-learning
