apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kaneo

helmCharts:
  - name: kaneo
    repo: oci://ghcr.io/usekaneo/charts
    version: 2.46.2
    releaseName: kaneo
    namespace: kaneo
    valuesFile: kaneo-values.yaml

resources:
  - sealed-secrets.yaml
  - oidc-sealed-secrets.yaml
  - ingress.yaml

patches:
  # Startup applies database migrations; avoid overlapping app versions.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kaneo
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
