apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-dev-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-dev-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-dev-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-dev-credentials
subjects:
  - kind: ServiceAccount
    name: paseo
    namespace: paseo
