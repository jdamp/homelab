apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo
  labels:
    app: paseo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paseo
  template:
    metadata:
      labels:
        app: paseo
    spec:
      serviceAccountName: paseo
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-agent-tools
          image: moby/buildkit:v0.33.1-rootless
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              cp /usr/bin/buildctl /builder/bin/buildctl
              # Create writable config directories on a fresh home PVC before
              # mounting the read-only instruction files in the main container.
              mkdir -p /home/paseo/.codex /home/paseo/.pi/agent
              chown 1000:1000 /home/paseo/.codex /home/paseo/.pi /home/paseo/.pi/agent
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
          volumeMounts:
            - name: builder-bin
              mountPath: /builder/bin
            - name: home
              mountPath: /home/paseo
      containers:
        - name: paseo
          image: ghcr.io/jdamp/paseo-agents:0.10.3-codex0.160.0-pi1.0.0@sha256:aeeae1567dda626c38a45aab14d1fade6e53f0a4b25cf94a900c85914b3aba66
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6767
              protocol: TCP
          env:
            # The buildkitd sidecar provides a Dockerfile-compatible builder
            # without exposing the node's container runtime to the agent.
            - name: BUILDKIT_HOST
              value: unix:///run/user/1000/buildkit/buildkitd.sock
            - name: PATH
              value: /builder/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: PASEO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paseo-auth
                  key: password
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-github
                  key: GH_TOKEN
            # Some GitHub integrations recognize only GITHUB_TOKEN. Keep both
            # names backed by the same SealedSecret value.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paseo-github
                  key: GH_TOKEN
            # Make regular HTTPS git operations use the token exposed to gh.
            - name: GIT_CONFIG_COUNT
              value: "2"
            - name: GIT_CONFIG_KEY_0
              value: credential.https://github.com.helper
            - name: GIT_CONFIG_VALUE_0
              value: ""
            - name: GIT_CONFIG_KEY_1
              value: credential.https://github.com.helper
            - name: GIT_CONFIG_VALUE_1
              value: "!gh auth git-credential"
            - name: PASEO_HOSTNAMES
              value: paseo.mauzlab.de
            # Traefik reaches the pod from K3s' default pod CIDR. Trusting it is
            # required for Paseo to honor X-Forwarded-Proto and advertise wss://.
            - name: PASEO_TRUSTED_PROXIES
              value: 10.42.0.0/16
            - name: OPENSPEC_TELEMETRY
              value: "0"
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: home
              mountPath: /home/paseo
            - name: workspace
              mountPath: /workspace
            # Mount the same source file at each agent's global instruction path.
            # Kustomize's ConfigMap hash triggers a rollout when it changes;
            # subPath mounts do not receive live ConfigMap updates.
            - name: agent-instructions
              mountPath: /home/paseo/.codex/AGENTS.md
              subPath: AGENTS.md
              readOnly: true
            - name: agent-instructions
              mountPath: /home/paseo/.pi/agent/AGENTS.md
              subPath: AGENTS.md
              readOnly: true
            - name: shell-profile
              mountPath: /etc/profile.d/paseo-path.sh
              subPath: paseo-path.sh
              readOnly: true
            - name: buildkit-socket
              mountPath: /run/user/1000/buildkit
            - name: builder-bin
              mountPath: /builder/bin
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
        - name: buildkitd
          image: moby/buildkit:v0.33.1-rootless
          imagePullPolicy: IfNotPresent
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            # Required for rootless RUN steps with Kubernetes' masked /proc.
            - --oci-worker-no-process-sandbox
          securityContext:
            # RootlessKit's newuidmap/newgidmap helpers require setuid privileges.
            allowPrivilegeEscalation: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: buildkit-socket
              mountPath: /run/user/1000/buildkit
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: paseo-home
        - name: workspace
          persistentVolumeClaim:
            claimName: paseo-workspace
        - name: agent-instructions
          configMap:
            name: paseo-agent-instructions
        - name: shell-profile
          configMap:
            name: paseo-shell-profile
        - name: buildkit-socket
          emptyDir: {}
        - name: builder-bin
          emptyDir: {}
