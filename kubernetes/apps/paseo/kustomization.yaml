apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: paseo

configMapGenerator:
  - name: paseo-agent-instructions
    files:
      - AGENTS.md=agent-instructions/AGENTS.md
  - name: paseo-shell-profile
    files:
      - paseo-path.sh=profile.d/paseo-path.sh

resources:
  - sealed-secrets.yaml
  - github-sealed-secrets.yaml
  - serviceaccount.yaml
  - pvc-home.yaml
  - pvc-workspace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
